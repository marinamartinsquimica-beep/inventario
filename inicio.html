<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Inventário - Home</title>

<link rel="manifest" href="manifest.json">
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 50% 20%, rgba(8, 117, 209, 0.28), transparent 32%),
      linear-gradient(145deg, #0f1720 0%, #1e1e1e 48%, #111827 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "Roboto", Arial, sans-serif;
    color: #fff;
    overflow: hidden;
    opacity: 0;
    animation: fadeBody 1.2s ease forwards;
  }

  .splash-card {
    width: min(86vw, 380px);
    padding: 34px 28px;
    border-radius: 34px;
    text-align: center;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.13);
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(16px);
    animation: cardIn 1s ease-in-out;
  }

  .logo-wrap {
    width: 190px;
    height: 190px;
    margin: 0 auto;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.18), transparent 65%);
    box-shadow: 0 0 45px rgba(8, 117, 209, 0.42);
  }

  .logo {
    width: 175px;
    height: 175px;
    object-fit: contain;
    filter: drop-shadow(0 16px 22px rgba(0, 0, 0, 0.28));
    animation: fadeIn 1.4s ease-in-out, float 3s ease-in-out infinite;
  }

  h1 {
    margin: 22px 0 8px;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 1px;
    animation: slideUp 1.3s ease-in-out;
  }

  p {
    margin: 0 auto 28px;
    color: rgba(255, 255, 255, 0.72);
    font-size: 15px;
    line-height: 1.5;
    max-width: 280px;
    animation: slideUp 1.45s ease-in-out;
  }

  .btn {
    width: 100%;
    padding: 16px 24px;
    border: none;
    border-radius: 18px;
    cursor: pointer;
    color: white;
    font-size: 19px;
    font-weight: 700;
    background: linear-gradient(135deg, #0875d1, #065ca3);
    box-shadow: 0 16px 30px rgba(8, 117, 209, 0.28);
    transition: 0.2s ease;
  }

  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: scale(0.98); }

  .version {
    margin-top: 22px;
    display: inline-block;
    padding: 7px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.10);
    color: rgba(255, 255, 255, 0.72);
    font-size: 12px;
  }

  @keyframes fadeBody { from { opacity: 0; } to { opacity: 1; } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.82); } to { opacity: 1; transform: scale(1); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
</style>
</head>

<body>
  <div class="splash-card">
    <div class="logo-wrap">
      <img src="icon-512.png" alt="Ícone Inventário" class="logo">
    </div>
    <h1>Inventário</h1>
    <p>Controle rápido e fácil de lotes, postura e estoque.</p>
    <button class="btn" onclick="window.location.href='index.html'">Entrar</button>
    <span class="version">Sistema local</span>
  </div>
</body>
</html>
